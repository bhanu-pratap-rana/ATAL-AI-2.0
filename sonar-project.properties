# SonarQube Project Configuration for ATAL AI
# Project Key: Atal-AI (must match SonarQube project key)

# Project identification
sonar.projectKey=Atal-AI
sonar.projectName=Atal AI
sonar.projectVersion=1.0.0

# Source code location (relative to this file)
sonar.sources=apps/web/src
sonar.sourceEncoding=UTF-8

# Exclude patterns
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/playwright/**,**/tests/**,**/*.config.*,**/jest.setup.js,**/jest.config.js,**/playwright.config.ts

# Test code location (if you want to analyze tests separately)
sonar.tests=apps/web/__tests__,apps/web/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info

# Language settings
sonar.language=ts

# SonarQube server connection (from .mcp.json)
sonar.host.url=http://localhost:9000
sonar.token=squ_1e4c2b8d8d74b82974d73d6909a3047c0c6ff150

# Additional settings
sonar.scanner.force-deprecated-java-version=true

# Disable Git integration to avoid issues with reserved Windows filenames
sonar.scm.disabled=true

