name: Supabase Advisors

# SP11 T11.2 — nightly snapshot of the Supabase security + performance
# advisor counts. Fails if WARN count regresses above the agreed
# baseline (40), which is generous compared to the post-SP1+SP2
# floor we shipped (~0 critical advisors).
#
# Requires repository secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token with project_metadata read
#   SUPABASE_PROJECT_REF   the projects reference id

on:
  schedule:
    # 02:30 UTC daily = 08:00 IST. Catches advisor changes from the
    # previous day's merges before standup.
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  pull-advisors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull security advisors
        id: security
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Supabase secrets not configured; skipping advisor check"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/security" \
            -o security.json
          jq -r '"WARN: \(.lints | map(select(.level=="WARN")) | length)\nERROR: \(.lints | map(select(.level=="ERROR")) | length)"' security.json

      - name: Pull performance advisors
        if: steps.security.outputs.skip != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/performance" \
            -o performance.json
          jq -r '"WARN: \(.lints | map(select(.level=="WARN")) | length)\nERROR: \(.lints | map(select(.level=="ERROR")) | length)"' performance.json

      - name: Enforce ceiling
        if: steps.security.outputs.skip != '1'
        run: |
          SEC_WARN=$(jq '.lints | map(select(.level=="WARN")) | length' security.json)
          SEC_ERR=$(jq '.lints | map(select(.level=="ERROR")) | length' security.json)
          PERF_WARN=$(jq '.lints | map(select(.level=="WARN")) | length' performance.json)
          # Baseline ceiling: any ERROR fails; SEC WARN > 40 fails.
          # Performance WARNs are noisier (unused-index churn etc.)
          # and only signal investigation, not failure.
          if [ "$SEC_ERR" -gt 0 ]; then
            echo "::error::Supabase Security Advisor has $SEC_ERR ERROR-level findings"
            jq -r '.lints[] | select(.level=="ERROR") | "  - \(.name): \(.title)"' security.json
            exit 1
          fi
          if [ "$SEC_WARN" -gt 40 ]; then
            echo "::error::Security Advisor WARN count ($SEC_WARN) exceeds baseline (40)"
            jq -r '.lints[] | select(.level=="WARN") | "  - \(.name): \(.title)"' security.json
            exit 1
          fi
          echo "::notice::Security: $SEC_WARN WARN, $SEC_ERR ERROR | Performance: $PERF_WARN WARN"
